[package]
name = "stwo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library implementing the Circle STARK prover and verifier"

[features]
default = ["std"]
std = [
    "blake2/std",
    "blake3/std",
    "hex/std",
    "itertools/use_std",
    "indexmap/std",
    "num-traits/std",
    "starknet-crypto/std",
    "thiserror/std",
    "tracing/std",
    "serde/std",
    "tracing-subscriber/std",
    "stwo-std-shims/std",
]
prover = ["std", "tracing/attributes"]
parallel = ["rayon", "indexmap/rayon"]
slow-tests = []
tracing = []
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
blake2.workspace = true
blake3.workspace = true
sha3.workspace = true
bytemuck = { workspace = true, features = ["derive", "extern_crate_alloc"] }
cfg-if.workspace = true
educe.workspace = true
hex.workspace = true
indexmap.workspace = true
fnv.workspace = true
itertools.workspace = true
num-traits.workspace = true
rand.workspace = true
starknet-crypto = { version = "0.6.2", default-features = false, features = [
    "alloc",
] }
starknet-ff = { version = "0.3.7", default-features = false, features = [
    "alloc",
    "serde",
] }
thiserror.workspace = true
tracing.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
tracing-subscriber.workspace = true
hashbrown.workspace = true
stwo-std-shims.workspace = true
dashmap.workspace = true

[dev-dependencies]
aligned.workspace = true
keccak.workspace = true
test-log.workspace = true

[package.metadata.cargo-machete]
ignored = ["stwo-std-shims"]

[target.'cfg(all(target_family = "wasm", not(target_os = "wasi")))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true, default-features = true }

# Default features cause compile error:
# "Rayon cannot be used when targeting wasi32. Try disabling default features."
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion.workspace = true

[lib]
bench = false
crate-type = ["lib"]

[lints.rust]
future-incompatible = "deny"
nonstandard-style = "deny"
rust-2018-idioms = "deny"

[lints.clippy]
missing_const_for_fn = "warn"

[[bench]]
harness = false
name = "bit_rev"
required-features = ["prover"]

[[bench]]
harness = false
name = "eval_at_point"
required-features = ["prover"]

[[bench]]
harness = false
name = "barycentric_eval_at_point"
required-features = ["prover"]

[[bench]]
harness = false
name = "eval_at_point_by_folding"
required-features = ["prover"]

[[bench]]
harness = false
name = "fft"
required-features = ["prover"]

[[bench]]
harness = false
name = "field"
required-features = ["prover"]

[[bench]]
harness = false
name = "fri"
required-features = ["prover"]

[[bench]]
harness = false
name = "lookups"
required-features = ["prover"]

[[bench]]
harness = false
name = "merkle"
required-features = ["prover"]

[[bench]]
harness = false
name = "prefix_sum"
required-features = ["prover"]

[[bench]]
harness = false
name = "pcs"
required-features = ["prover"]

[[bench]]
harness = false
name = "fri_quotients"
required-features = ["prover"]
