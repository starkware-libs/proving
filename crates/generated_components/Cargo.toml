[package]
name = "generated_components"
version.workspace = true
edition.workspace = true

[dependencies]
itertools.workspace = true
num-traits.workspace = true
serde.workspace = true
starknet-ff.workspace = true
stwo-prover = { git = "https://github.com/starkware-libs/stwo", rev = "8ab5601" }
stwo-air-utils = { git = "https://github.com/starkware-libs/stwo", rev = "8ab5601" }
stwo-air-utils-derive = { git = "https://github.com/starkware-libs/stwo", rev = "8ab5601" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo.git", rev = "c9a4ea1" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo.git", rev = "c9a4ea1" }
rayon = "1.10.0"

[features]
default = []
fix_code = []

[dev-dependencies]
rand = { version = "0.8.5" }

# used by the macro CairoSerialize yet flagged by machete as unused
[package.metadata.cargo-machete]
ignored = ["starknet-ff"]
