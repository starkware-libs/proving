[package]
name = "circuit-multiverifier"
version.workspace = true
edition.workspace = true

[features]
# Exposes the `test_utils` module (canonical-config fixtures and helpers) to other crates' tests.
test-utils = ["dep:blake2", "dep:circuit-prover", "dep:circuit-cairo-verifier", "circuit-common/prover"]

[dependencies]
itertools.workspace = true
stwo.workspace = true
stwo-constraint-framework.workspace = true
circuits.workspace = true
circuits-stark-verifier.workspace = true
circuit-verifier.workspace = true
circuit-common.workspace = true
blake2 = { workspace = true, optional = true }
circuit-prover = { workspace = true, optional = true }
circuit-cairo-verifier = { workspace = true, optional = true }

[dev-dependencies]
blake2.workspace = true
serde_json.workspace = true
stwo = { workspace = true, features = ["prover"] }
stwo-constraint-framework = { workspace = true, features = ["prover"] }
circuit-common = { workspace = true, features = ["prover"] }
circuits-stark-verifier.workspace = true
cairo-air.workspace = true
circuit-prover.workspace = true
circuit-cairo-verifier.workspace = true
circuit-serialize.workspace = true
circuit-cairo-serialize.workspace = true
