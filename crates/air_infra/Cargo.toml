regex = "1.11.1"

stwo-cairo-common.workspace = true

[dev-dependencies]
eval_air_fn_constraints = { path = "../eval_air_fn_constraints" }
generic-tests.workspace = true
expect-test = "1.4"
blake2 = "0.10.6"
