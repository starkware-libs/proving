[package]
name = "circuit-verifier"
version.workspace = true
edition.workspace = true

[features]
# Exposes the `test_utils` module (out-of-circuit helpers) to other crates' tests.
test-utils = ["dep:blake2"]

[dependencies]
blake2 = { workspace = true, optional = true }
itertools.workspace = true
num-traits.workspace = true
rand_chacha.workspace = true

stwo.workspace = true
stwo-constraint-framework.workspace = true
circuits.workspace = true
circuits-stark-verifier.workspace = true
circuit-common.workspace = true

[dev-dependencies]
circuit-verifier = { path = ".", features = ["test-utils"] }
cairo-air.workspace = true
circuit-cairo-verifier = { workspace = true, features = ["test-utils"] }
circuit-prover = { workspace = true, features = ["test-utils"] }
circuit-serialize.workspace = true
privacy_common.workspace = true
stwo = { workspace = true, features = ["prover"] }
