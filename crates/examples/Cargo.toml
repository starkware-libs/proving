[package]
name = "stwo-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example implementations using the STWO prover"

[features]
parallel = ["dep:rayon", "stwo/parallel"]
tracing = ["stwo/tracing"]
slow-tests = []

[lib]
bench = false

[dependencies]
rayon = { workspace = true, optional = true }
num-traits.workspace = true
itertools.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
stwo = { workspace = true, features = ["prover"] }
stwo-constraint-framework = { workspace = true, features = ["prover"] }
rand.workspace = true
educe.workspace = true

# rayon cannot build a thread pool on threadless wasm targets (e.g. wasm32-wasip1),
# so the `parallel` feature (which pulls in rayon) is only enabled off-wasm. On wasm
# the crates fall back to their sequential code paths.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stwo-constraint-framework = { workspace = true, features = ["parallel"] }

[dev-dependencies]
criterion.workspace = true
ndarray.workspace = true
test-log.workspace = true

[[bench]]
harness = false
name = "poseidon"
