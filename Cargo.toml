[workspace]
# Using version 2 to avoid unifying features. For more info, read:
#   https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = [
    "crates/air_code_gen",
    "crates/air_infra",
    "crates/generated_components",
    "crates/derive_macros/inst_def",
    "crates/compiled_casm_air",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
genco = "0.17.8"
itertools = "0.12.1"
num-integer = "0.1.46"
num-traits = "0.2.18"
serde = "1.0.196"
serde_json = "1.0.113"
stwo-prover = { git = "https://github.com/starkware-libs/stwo", rev = "9cfd48a" }
prover_types ={ git = "https://github.com/starkware-libs/stwo-cairo.git", rev = "194e411" }
xshell = "0.2.5"
indexmap = "2.2.6"