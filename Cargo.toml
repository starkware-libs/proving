[workspace]
# Using version 2 to avoid unifying features. For more info, read:
#   https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = [
    "crates/air_code_gen",
    "crates/air_infra",
    "crates/compiled_casm_air",
    "crates/eval_air_fn_constraints",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
genco = "0.17.8"
itertools = "0.12.1"
num-traits = "0.2.18"
serde = "1.0.196"
serde_json = { version = "1.0.113", features = ["preserve_order"] }
xshell = "0.2.5"
indexmap = "2.2.6"
convert_case = "0.8.0"
eval_air_fn_constraints = { path = "./crates/eval_air_fn_constraints" }
generic-tests = "0.1.3"

stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo.git", rev = "6f189b84" }
