name: stwo-cairo-prover CI

on:
  workflow_call:
    inputs: &crate_group_input
      # Cargo `-p` args for this group. Source of truth: scripts/ci_dispatch.py.
      crate_group:
        description: "Cargo -p args for the group"
        required: true
        type: string
  workflow_dispatch:
    inputs: *crate_group_input

env:
  STABLE_VERSION: "1.94.0"
  NIGHTLY_VERSION: "nightly-2026-01-15"

jobs:
  tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-xlarge-ubuntu-24-04-amd64
    env:
      RUST_MIN_STACK: 4194304
      RUSTFLAGS: -C target-cpu=native
      RUST_LOG_SPAN_EVENTS: enter,close
      RUST_LOG: info
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - name: Install latest nextest release
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: nextest
      - name: Fetch cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: |
          cargo nextest run ${{ inputs.crate_group }} -P ci

  slow-tests:
    # TODO(Leo): consider running it also on PRs if cheap enough.
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: namespace-profile-starkware-libs-proving-dev-xlarge-ubuntu-24-04-amd64
    strategy:
      # A failing shard must not cancel its siblings.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXTTEST_THREADS: "1"
      RUST_MIN_STACK: 4194304
      RUSTFLAGS: -C target-cpu=native
      RUST_LOG_SPAN_EVENTS: enter,close
      RUST_LOG: info
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - name: Install latest nextest release
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: nextest
      - name: Fetch cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # All shards build exactly the same artifacts, so they must share one cache
          # entry instead of getting a per-shard key.
          shared-key: slow-tests
          # Only one shard should write the cache back.
          save-if: ${{ matrix.shard == 1 }}
      - run: |
          cargo nextest run -p stwo-cairo-prover \
            --test slow_tests \
            --cargo-profile ci \
            -j ${{ env.NEXTTEST_THREADS }} \
            --partition count:${{ matrix.shard }}/${{ strategy.job-total }} \
            -P ci

  cairo-prover-wasm:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rust-src
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build stwo_cairo_prover for wasm64
        run: RUSTFLAGS='--cfg getrandom_backend="custom"' cargo check --target wasm64-unknown-unknown -Z build-std=std,panic_abort -p stwo-cairo-prover --release

  cairo-air-wasm:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build cairo-air for wasm32
        run: cargo check -p cairo-air --no-default-features --target wasm32-unknown-unknown --release
