name: stwo-cairo-prover CI

on:
  workflow_call:
    inputs:
      # Cargo `-p` args for this group. Source of truth: scripts/ci_dispatch.py.
      crate_group:
        description: "Cargo -p args for the group"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      # Cargo `-p` args for this group. Source of truth: scripts/ci_dispatch.py.
      crate_group:
        description: "Cargo -p args for the group"
        required: true
        type: string

env:
  STABLE_VERSION: "1.94.0"
  NIGHTLY_VERSION: "nightly-2026-01-15"

jobs:
  tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-xlarge-ubuntu-24-04-amd64
    env:
      NEXTTEST_THREADS: "1"
      RUST_MIN_STACK: 4194304
      RUSTFLAGS: -C target-cpu=native
      RUST_LOG_SPAN_EVENTS: enter,close
      RUST_LOG: info
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest
      - name: Fetch cache
        uses: Swatinem/rust-cache@v2
      - run: |
          cargo nextest run ${{ inputs.crate_group }} \
            --cargo-profile witness-opt-1 \
            --features=stwo-cairo-prover/integration \
            -j ${{ env.NEXTTEST_THREADS }} \
            -P ci

  slow-tests:
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: namespace-profile-starkware-libs-proving-dev-xlarge-ubuntu-24-04-amd64
    env:
      NEXTTEST_THREADS: "1"
      RUST_MIN_STACK: 4194304
      RUSTFLAGS: -C target-cpu=native
      RUST_LOG_SPAN_EVENTS: enter,close
      RUST_LOG: info
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest
      - name: Fetch cache
        uses: Swatinem/rust-cache@v2
      - run: |
          cargo nextest run ${{ inputs.crate_group }} \
            --cargo-profile witness-opt-1 \
            --features=stwo-cairo-prover/integration,stwo-cairo-prover/slow-tests,stwo-cairo-adapter/slow-tests,cairo-air/slow-tests \
            -j ${{ env.NEXTTEST_THREADS }} \
            -P ci
      - run: |
          cargo nextest run \
            --cargo-profile witness-opt-1 \
            --features=extract-mem-trace test_serialize_deserialize_mem_trace \
            -j ${{ env.NEXTTEST_THREADS }} \
            -P ci

  cairo-prover-wasm:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Build stwo_cairo_prover for wasm64
        run: RUSTFLAGS='--cfg getrandom_backend="custom"' cargo check --target wasm64-unknown-unknown -Z build-std=std,panic_abort -p stwo-cairo-prover --release

  cairo-air-wasm:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build cairo-air for wasm32
        run: cargo check -p cairo-air --no-default-features --target wasm32-unknown-unknown --release
