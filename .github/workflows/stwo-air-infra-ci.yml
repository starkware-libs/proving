name: stwo-air-infra CI

on:
  workflow_call:
    inputs:
      # Cargo `-p` args for this group. Source of truth: scripts/ci_dispatch.py.
      crate_group:
        description: "Cargo -p args for the group"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      # Cargo `-p` args for this group. Source of truth: scripts/ci_dispatch.py.
      crate_group:
        description: "Cargo -p args for the group"
        required: true
        type: string

env:
  STABLE_VERSION: "1.94.0"

jobs:
  js-typecheck:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.2.10
      - run: scripts/js_typecheck.sh

  visualizer-webapp-test:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.2.10
      - run: scripts/visualizer_webapp_test.sh

  # TODO(Leo): add test for equality of generated files.
  tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          scarb-version: "2.18.0"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          components: rustfmt
          profile: minimal
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo +${{ env.STABLE_VERSION }} test --release ${{ inputs.crate_group }}
