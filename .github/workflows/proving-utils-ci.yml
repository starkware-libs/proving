name: proving-utils CI

env:
  STABLE_VERSION: "1.94.0"
  NIGHTLY_VERSION: "nightly-2026-01-15"

on:
  workflow_call:
    inputs: &crate_group_input
      # Cargo `-p` args for this group. Source of truth: scripts/ci_dispatch.py.
      crate_group:
        description: "Cargo -p args for the group"
        required: true
        type: string
  workflow_dispatch:
    inputs: *crate_group_input

jobs:
  tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-large-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
          profile: minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false
      - name: "Unit tests"
        run: |
          cargo test --release ${{ inputs.crate_group }} --all-targets
      - name: "Test examples"
        run: |
          cargo run -p cairo-program-runner-lib --example run_program_with_simple_bl
          cargo run -p cairo-program-runner-lib --example run_pie_object_with_simple_bl

  slow-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-xlarge-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install latest nextest release
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: nextest
      # The recursive tree's golden e2e ends with a `scarb execute` of the Cairo circuit verifier.
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          tool-versions: .tool-versions
      - name: "Slow tests"
        run: |
          cargo nextest run -p leaf-prover --features=slow-tests --cargo-profile ci  -j 1 -P ci
          cargo nextest run -p circuit-params --features=slow-tests --cargo-profile ci  -j 1 -P ci
          cargo nextest run -p stwo-run-and-prove-recursive-tree --features=slow-tests --cargo-profile ci -j 1 -P ci
        env:
          RUST_MIN_STACK: 4194304
          RUSTFLAGS: -C target-cpu=native
          RUST_LOG_SPAN_EVENTS: enter,close
          RUST_LOG: info

  privacy-slow-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-xlarge-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install latest nextest release
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: nextest
      - name: "Slow tests"
        run: |
          cargo nextest run -p privacy-prove --features=slow-tests --cargo-profile ci -j 1 -P ci
          cargo nextest run -p privacy-circuit-verify --features=slow-tests --cargo-profile ci -j 1 -P ci
        env:
          RUST_MIN_STACK: 4194304
          RUSTFLAGS: -C target-cpu=native
          RUST_LOG_SPAN_EVENTS: enter,close
          RUST_LOG: info
