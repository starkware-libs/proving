name: stwo CI

env:
  STABLE_VERSION: "1.94.0"
  NIGHTLY_VERSION: "nightly-2026-01-15"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  wasm32-wasip1-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: wasmtime
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --"
          RUSTFLAGS: -C target-feature=+simd128

  wasm32-unknown-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.13.1"
      - run: cd crates/stwo && wasm-pack test --node
        env:
          RUSTFLAGS: -C target-feature=+simd128

  neon-tests:
    runs-on: macos-latest-xlarge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo --features="prover"
        env:
          RUSTFLAGS: -C target-feature=+neon

  avx-tests:
    strategy:
      matrix:
        target-feature: [avx512f, avx2]
    runs-on: namespace-profile-starkware-libs-proving-dev-large-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo --features="prover"
        env:
          RUSTFLAGS: -C target-cpu=native -C target-feature=+${{ matrix.target-feature }}

  tests-no-prover:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --no-default-features -p stwo

  tests-prover-no-parallel:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --features prover -p stwo

  framework-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --no-default-features -p stwo-constraint-framework

  examples-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo-examples

  # `slow-tests` un-ignores blake's `test_simd_blake_prove`, which is too slow for a debug
  # build. The poseidon tests stay ignored by design (constraint degree >= 2 is unsupported
  # in the lifted protocol).
  examples-slow-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo-examples --release --features="slow-tests"

  air-utils-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo-air-utils

  tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo --features="tracing, prover"

  slow-tests:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo --release --features="slow-tests, prover"

  tests-parallel:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p stwo --features="parallel, prover"

  ensure-no-std-core:
    runs-on: namespace-profile-starkware-libs-proving-dev-small-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ensure-verifier-no_std
      - run: cd ensure-verifier-no_std && cargo build -r
